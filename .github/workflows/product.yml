name: Build product images

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build images
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/pmh-only/keysboard:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=product-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=product-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested native architectures together
        run: |
          docker buildx imagetools create \
            -t ghcr.io/pmh-only/keysboard:latest \
            -t ghcr.io/pmh-only/keysboard:${{ github.sha }} \
            ghcr.io/pmh-only/keysboard:${{ github.sha }}-arm64 \
            ghcr.io/pmh-only/keysboard:${{ github.sha }}-amd64
